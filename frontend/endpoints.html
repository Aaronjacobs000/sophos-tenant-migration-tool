<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endpoints · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body class="shell">
  <div class="bg" aria-hidden="true"><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div></div>
  <aside id="app-rail" class="rail"></aside>
  <div class="shell-main">
  <header id="app-nav" class="topbar"></header>

  <main class="page-main">
    <h1>Endpoints</h1>
    <p class="page-lead">Devices on both tenants. Select devices on one side and move them to the other,
      source to destination or back again. Devices that have not checked in for 14 days cannot move.</p>

    <div class="panel-toolbar">
      <label class="checkbox">
        <input type="checkbox" id="hide-stale" />
        Hide stale devices (outside the 14-day window)
      </label>
    </div>

    <div class="split-row">
      <section class="panel-card ep-card">
        <div class="panel-toolbar">
          <h2 class="side-title">Source</h2>
          <span class="spacer"></span>
          <input type="search" id="search-source" placeholder="Filter hostnames" />
          <button class="btn btn-small" id="select-all-source">Select all</button>
          <button type="button" class="icon-btn" id="refresh-source" title="Reload source devices from Sophos" aria-label="Reload source devices from Sophos"><span data-icon="refresh"></span></button>
        </div>
        <div id="table-source" class="table-wrap-narrow"><div class="empty-state">Loading</div></div>
      </section>
      <section class="panel-card ep-card">
        <div class="panel-toolbar">
          <h2 class="side-title is-dest">Destination</h2>
          <span class="spacer"></span>
          <input type="search" id="search-dest" placeholder="Filter hostnames" />
          <button class="btn btn-small" id="select-all-dest">Select all</button>
          <button type="button" class="icon-btn" id="refresh-dest" title="Reload destination devices from Sophos" aria-label="Reload destination devices from Sophos"><span data-icon="refresh"></span></button>
        </div>
        <div id="table-dest" class="table-wrap-narrow"><div class="empty-state">Loading</div></div>
      </section>
    </div>
  </main>

  <div id="selection-basket" class="selection-basket hidden">
    <span id="basket-text" class="basket-text"></span>
    <span class="basket-sep"></span>
    <button id="basket-clear" class="btn">Clear</button>
    <button id="basket-migrate" class="btn btn-primary">Migrate<span data-icon="arrowRight"></span></button>
  </div>

  <footer id="page-footer" class="page-footer"></footer>
  </div>
  <script type="module" src="/js/page-endpoints.js"></script>
</body>
</html>
