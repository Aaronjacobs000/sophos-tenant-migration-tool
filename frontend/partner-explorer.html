<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Explorer · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body class="shell">
  <div class="bg" aria-hidden="true"><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div></div>
  <aside id="app-rail" class="rail"></aside>
  <div class="shell-main">
  <header id="app-nav" class="topbar"></header>

  <main class="page-main">
    <h1>Partner Explorer</h1>
    <p class="page-lead">Browse every tenant your partner or organization credentials manage, and find devices across all of them.</p>

    <section class="panel-card">
      <div class="card-head"><h2>Device search across all tenants</h2></div>
      <p class="card-sub">Search by hostname across every managed tenant. Results show which tenant each device is in.</p>
      <div class="panel-toolbar">
        <input type="search" id="global-search" class="wide-search" placeholder="Hostname" />
        <button id="global-search-btn" class="btn btn-primary">Search</button>
      </div>
      <div id="global-results" class="table-wrap"></div>
    </section>

    <section class="panel-card">
      <div class="panel-toolbar">
        <h2>Managed tenants</h2>
        <span class="spacer"></span>
        <input type="search" id="filter-tenants" placeholder="Filter by name" />
        <span id="tenant-count" class="hint"></span>
      </div>
      <div id="tenant-list" class="table-wrap"><div class="empty-state">Loading</div></div>
    </section>

    <section class="panel-card hidden" id="tenant-detail">
      <div class="panel-toolbar">
        <h2 id="detail-title">Tenant detail</h2>
        <span class="spacer"></span>
        <button id="close-detail" class="btn btn-small">Close</button>
      </div>
      <div id="detail-body"></div>
    </section>
  </main>

  <footer id="page-footer" class="page-footer"></footer>
  </div>
  <script type="module" src="/js/page-partner-explorer.js"></script>
</body>
</html>
