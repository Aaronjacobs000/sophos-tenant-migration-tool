<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machine search · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body class="shell">
  <div class="bg" aria-hidden="true"><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div></div>
  <aside id="app-rail" class="rail"></aside>
  <div class="shell-main">
  <header id="app-nav" class="topbar"></header>

  <main class="page-main">
    <h1>Machine search</h1>
    <p class="page-lead">Find devices by hostname on the connected tenants. Ctrl K runs the same search from any page.</p>

    <section class="panel-card">
      <div class="panel-toolbar">
        <input type="search" id="search-input" class="wide-search" placeholder="Hostname or part of one" />
        <select id="scope-select">
          <option value="source-dest">Source and destination only</option>
          <option value="all">All managed tenants (partner mode)</option>
        </select>
        <button id="search-btn" class="btn btn-primary">Search</button>
      </div>
      <div id="results" class="table-wrap"><div class="empty-state">Enter a hostname above and press Search.</div></div>
    </section>
  </main>

  <footer id="page-footer" class="page-footer"></footer>
  </div>
  <script type="module" src="/js/page-search.js"></script>
</body>
</html>
