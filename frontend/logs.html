<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body class="shell">
  <div class="bg" aria-hidden="true"><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div></div>
  <aside id="app-rail" class="rail"></aside>
  <div class="shell-main">
  <header id="app-nav" class="topbar"></header>

  <main class="page-main">
    <h1>Logs</h1>
    <p class="page-lead">The local server's last 500 log entries. Filter by section, side or level.</p>

    <div class="panel-toolbar toolbar-bar toolbar-sticky">
      <label class="hint">Section
        <select id="filter-section">
          <option value="">All</option>
          <option value="preload">preload</option>
          <option value="state">state</option>
          <option value="credentials">credentials</option>
        </select>
      </label>
      <label class="hint">Side
        <select id="filter-side">
          <option value="">Any</option>
          <option value="source">source</option>
          <option value="dest">dest</option>
        </select>
      </label>
      <label class="hint">Level
        <select id="filter-level">
          <option value="">All</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
        </select>
      </label>
      <input type="search" id="search" placeholder="Filter messages" />
      <span class="spacer"></span>
      <label class="checkbox">
        <input type="checkbox" id="auto-refresh" checked />
        Auto-refresh
      </label>
      <button id="refresh-now" class="btn btn-small"><span data-icon="refresh"></span>Refresh</button>
      <button id="clear-logs" class="btn btn-small">Clear</button>
    </div>

    <section class="panel-card">
      <div id="logs-table" class="table-wrap"><div class="empty-state">Loading</div></div>
    </section>
  </main>

  <footer id="page-footer" class="page-footer"></footer>
  </div>
  <script type="module" src="/js/page-logs.js"></script>
</body>
</html>
